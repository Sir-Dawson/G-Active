<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="G Active Fitness admin login and post creator.">
  <title>G Active Fitness | Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --ink: #171916;
      --paper: #f2f1e9;
      --red: #f0524b;
      --muted: #aeb0a7;
      --line: rgba(242, 241, 233, 0.2);
      --display: "Archivo Black", Impact, sans-serif;
      --body: "DM Sans", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--body);
    }
    a { color: inherit; }
    .topbar {
      display: flex;
      width: min(1180px, calc(100% - 48px));
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 0 auto;
      padding: 28px 0;
      border-bottom: 1px solid var(--line);
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: clamp(12px, 2vw, 28px);
      flex-wrap: wrap;
    }
    .nav-links a {
      color: rgba(242, 241, 233, 0.75);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
    }
    .brand-mark {
      display: grid;
      width: 37px;
      aspect-ratio: 1;
      place-items: center;
      background: var(--red);
      color: var(--ink);
      font: 18px var(--display);
      transform: skew(-7deg);
    }
    .brand-name { font-size: 14px; font-weight: 700; line-height: 1.05; }
    .brand-name span { display: block; color: var(--red); font-size: 10px; font-weight: 600; }
    .page-shell {
      width: min(1100px, calc(100% - 48px));
      margin: 0 auto;
      padding: 58px 0 80px;
    }
    .panel-wrap {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px;
    }
    .panel {
      padding: 28px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 18px;
      color: var(--red);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .12em;
    }
    .eyebrow::before { width: 28px; height: 2px; background: currentColor; content: ""; }
    h1, h2, label, p { margin-top: 0; }
    h1 {
      margin-bottom: 16px;
      font: clamp(36px, 5vw, 62px)/.96 var(--display);
      text-transform: uppercase;
    }
    form {
      display: grid;
      gap: 16px;
    }
    label {
      display: grid;
      gap: 8px;
      color: rgba(242, 241, 233, 0.88);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    input, textarea, select {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      color: var(--paper);
      font: inherit;
    }
    input[type="file"] { padding: 10px; }
    textarea {
      min-height: 140px;
      resize: vertical;
    }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      border: 0;
      background: var(--red);
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .hidden { display: none; }
    .message {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .status {
      color: var(--red);
      font-weight: 700;
    }
    .list {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }
    .list-item {
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.01);
    }
    .list-item strong { display: block; margin-bottom: 4px; }
    @media (max-width: 780px) {
      .panel-wrap { grid-template-columns: 1fr; }
      .topbar, .page-shell { width: calc(100% - 36px); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="G Active Fitness home">
      <span class="brand-mark" aria-hidden="true">G</span>
      <span class="brand-name">G ACTIVE<span>FITNESS</span></span>
    </a>
    <nav class="nav-links" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="blog.html">Blog</a>
      <a href="admin.html">Admin</a>
    </nav>
  </header>

  <main class="page-shell">
    <div class="panel-wrap">
      <section class="panel" id="login-panel">
        <p class="eyebrow">Owner access</p>
        <h1>Admin login</h1>
        <form id="login-form">
          <label>
            Email
            <input type="email" id="email" name="email" placeholder="owner@gactivefitness.com" required>
          </label>
          <label>
            Password
            <input type="password" id="password" name="password" placeholder="Enter password" required>
          </label>
          <button type="submit">Login</button>
        </form>
        <p class="message">Demo login:<br>owner@gactivefitness.com / gactive123</p>
      </section>

      <section class="panel hidden" id="admin-panel">
        <p class="eyebrow">Owner dashboard</p>
        <button type="button" id="create-post-button" aria-controls="post-editor" aria-expanded="false">Create post</button>
        <div id="post-editor" class="hidden">
          <h2>Draft a new blog post</h2>
          <form id="post-form">
            <label>
              Title
              <input type="text" id="title" name="title" placeholder="New blog title" required>
            </label>
            <label>
              Category
              <select id="category" name="category">
                <option value="Mindset">Mindset</option>
                <option value="Strength">Strength</option>
                <option value="Recovery">Recovery</option>
                <option value="Nutrition">Nutrition</option>
              </select>
            </label>
            <label>
              Summary
              <textarea id="summary" name="summary" placeholder="Short summary for the blog list" required></textarea>
            </label>
            <label>
              Full article
              <textarea id="content" name="content" placeholder="Write the full blog article here" required></textarea>
            </label>
            <label>
              Article image (optional, maximum 25 MB)
              <input type="file" id="image" name="image" accept="image/*">
            </label>
            <button type="submit">Publish article</button>
          </form>
        </div>
        <div id="post-status" class="message" aria-live="polite"></div>

        <div class="list" id="post-list"></div>
      </section>
    </div>
  </main>

  <script>
    const ADMIN_EMAIL = 'owner@gactivefitness.com';
    const ADMIN_PASSWORD = 'gactive123';
    const STORAGE_KEY = 'gactive_blog_posts';
    const IMAGE_DATABASE = 'gactive_blog_media';
    const MAX_IMAGE_BYTES = 25 * 1024 * 1024;
    const SAMPLE_POST_IDS = ['routine-you-will-keep', 'three-strength-shifts', 'recovery-and-progress'];

    function openImageDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(IMAGE_DATABASE, 1);
        request.onupgradeneeded = () => request.result.createObjectStore('images');
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function savePostImage(imageId, image) {
      const database = await openImageDatabase();
      return new Promise((resolve, reject) => {
        const transaction = database.transaction('images', 'readwrite');
        transaction.objectStore('images').put(image, imageId);
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
      });
    }

    function getPosts() {
      const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      return Array.isArray(stored) ? stored.filter((post) => !SAMPLE_POST_IDS.includes(post.id)) : [];
    }

    function savePosts(posts) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
    }

    function renderPostList() {
      const list = document.getElementById('post-list');
      const posts = getPosts();
      list.replaceChildren();
      if (!posts.length) {
        const emptyMessage = document.createElement('p');
        emptyMessage.className = 'message';
        emptyMessage.textContent = 'No posts yet. Create your first post to get started.';
        list.append(emptyMessage);
        return;
      }
      posts.forEach((post) => {
        const item = document.createElement('div');
        item.className = 'list-item';
        const title = document.createElement('strong');
        title.textContent = post.title;
        const details = document.createElement('span');
        details.textContent = `${post.category} · ${new Date(post.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}`;
        item.append(title, details);
        list.append(item);
      });
    }

    const loggedIn = localStorage.getItem('gactive_admin_logged_in') === 'true';
    const loginPanel = document.getElementById('login-panel');
    const adminPanel = document.getElementById('admin-panel');
    const createPostButton = document.getElementById('create-post-button');
    const postEditor = document.getElementById('post-editor');

    if (loggedIn) {
      loginPanel.classList.add('hidden');
      adminPanel.classList.remove('hidden');
    }

    renderPostList();

    createPostButton.addEventListener('click', function () {
      postEditor.classList.remove('hidden');
      createPostButton.classList.add('hidden');
      createPostButton.setAttribute('aria-expanded', 'true');
      document.getElementById('title').focus();
    });

    document.getElementById('login-form').addEventListener('submit', function (event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
        localStorage.setItem('gactive_admin_logged_in', 'true');
        loginPanel.classList.add('hidden');
        adminPanel.classList.remove('hidden');
      } else {
        alert('Incorrect admin credentials. Use the demo login shown below.');
      }
    });

    document.getElementById('post-form').addEventListener('submit', async function (event) {
      event.preventDefault();
      const title = document.getElementById('title').value.trim();
      const category = document.getElementById('category').value;
      const summary = document.getElementById('summary').value.trim();
      const content = document.getElementById('content').value.trim();
      const image = document.getElementById('image').files[0];
      const status = document.getElementById('post-status');
      status.classList.remove('status');

      if (!title || !summary || !content) {
        status.textContent = 'Please complete every field before publishing.';
        return;
      }
      if (image && !image.type.startsWith('image/')) {
        status.textContent = 'Choose a valid image file.';
        return;
      }
      if (image && image.size > MAX_IMAGE_BYTES) {
        status.textContent = 'Image must be 25 MB or smaller.';
        return;
      }

      const id = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'draft-post';
      const posts = getPosts();
      const imageId = image ? (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`) : null;
      const newPost = {
        id,
        title,
        category,
        summary,
        date: new Date().toISOString(),
        minutes: Math.max(3, Math.ceil((content.split(/\s+/).length || 1) / 120)),
        content: content.split(/\n{2,}/).filter(Boolean),
        ...(image ? { imageId, imageAlt: title } : {})
      };

      try {
        if (image) await savePostImage(imageId, image);
        savePosts([newPost, ...posts]);
        renderPostList();
        status.classList.add('status');
        status.textContent = 'Article published to the local blog preview.';
        document.getElementById('post-form').reset();
        postEditor.classList.add('hidden');
        createPostButton.classList.remove('hidden');
        createPostButton.setAttribute('aria-expanded', 'false');
      } catch (error) {
        status.textContent = 'Could not save the article in this browser. Check available site storage and try again.';
      }
    });
  </script>
</body>
</html>
