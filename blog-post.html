<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="G Active Fitness blog post sample.">
  <title>G Active Fitness | Blog Post</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --ink: #171916;
      --paper: #f2f1e9;
      --red: #f0524b;
      --muted: #aeb0a7;
      --line: rgba(242, 241, 233, 0.2);
      --display: "Archivo Black", Impact, sans-serif;
      --body: "DM Sans", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--body);
    }
    a { color: inherit; }
    .topbar {
      display: flex;
      width: min(1180px, calc(100% - 48px));
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 0 auto;
      padding: 28px 0;
      border-bottom: 1px solid var(--line);
    }
    .nav-wrap { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; justify-content: flex-end; }
    .nav-links { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; }
    .nav-links a {
      color: rgba(242, 241, 233, 0.75);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
    }
    .brand-mark {
      display: grid;
      width: 37px;
      aspect-ratio: 1;
      place-items: center;
      background: var(--red);
      color: var(--ink);
      font: 18px var(--display);
      transform: skew(-7deg);
    }
    .brand-name { font-size: 14px; font-weight: 700; line-height: 1.05; }
    .brand-name span { display: block; color: var(--red); font-size: 10px; font-weight: 600; }
    .page-shell {
      width: min(860px, calc(100% - 48px));
      margin: 0 auto;
      padding: 58px 0 80px;
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 18px;
      color: var(--red);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .12em;
    }
    .eyebrow::before { width: 28px; height: 2px; background: currentColor; content: ""; }
    h1, h2, p { margin-top: 0; }
    h1 {
      margin-bottom: 18px;
      font: clamp(40px, 6vw, 72px)/0.96 var(--display);
      text-transform: uppercase;
    }
    .meta {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .article-body {
      margin-top: 28px;
      color: rgba(242, 241, 233, 0.82);
      font-size: 17px;
      line-height: 1.8;
    }
    .article-body p { margin-bottom: 22px; }
    .article-body h2 {
      margin-top: 32px;
      margin-bottom: 14px;
      font: 28px/1.1 var(--display);
      text-transform: uppercase;
    }
    .back-link {
      display: inline-flex;
      margin-top: 30px;
      min-height: 48px;
      align-items: center;
      padding: 0 18px;
      background: var(--red);
      color: var(--ink);
      font-weight: 700;
      text-decoration: none;
    }
    footer {
      display: flex;
      width: min(1180px, calc(100% - 48px));
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 0 auto;
      padding: 22px 0 30px;
      color: var(--muted);
      font-size: 11px;
    }
    footer p { margin: 0; }
    @media (max-width: 700px) {
      .topbar, .page-shell, footer { width: calc(100% - 36px); }
      .nav-wrap { width: 100%; justify-content: space-between; }
      .nav-links { width: 100%; justify-content: space-between; }
      footer { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="G Active Fitness home">
      <span class="brand-mark" aria-hidden="true">G</span>
      <span class="brand-name">G ACTIVE<span>FITNESS</span></span>
    </a>
    <div class="nav-wrap">
      <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="blog.html">Blog</a>
        <a href="index.html#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main class="page-shell">
    <div id="article-content"></div>
    <a class="back-link" href="blog.html">Back to blog</a>
  </main>

  <footer>
    <p>G Active Fitness</p>
    <p>Personal training for real life.</p>
    <p>&copy; 2026 G Active Fitness</p>
  </footer>

  <script>
    const storageKey = 'gactive_blog_posts';
    const samplePostIds = ['routine-you-will-keep', 'three-strength-shifts', 'recovery-and-progress'];
    const params = new URLSearchParams(window.location.search);
    const articleId = params.get('id');
    const savedPosts = JSON.parse(localStorage.getItem(storageKey) || 'null');
    const articleContent = document.getElementById('article-content');
    const article = (Array.isArray(savedPosts) ? savedPosts : [])
      .find((post) => post.id === articleId && !samplePostIds.includes(post.id));
    if (!article) {
      articleContent.textContent = 'This article could not be found.';
    } else {
      const readableDate = new Date(article.date).toLocaleDateString('en-GB', {
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });

      articleContent.innerHTML = `
        <p class="eyebrow">${article.category}</p>
        <h1>${article.title}</h1>
        <p class="meta">${article.minutes} min read · ${readableDate}</p>
        <article class="article-body">
          ${article.content.map((para) => `<p>${para}</p>`).join('')}
        </article>
      `;
    }
  </script>
</body>
</html>
