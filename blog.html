<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171916">
  <meta name="description" content="G Active Fitness blog and coaching insights.">
  <title>G Active Fitness | Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --ink: #171916;
      --paper: #f2f1e9;
      --red: #f0524b;
      --muted: #aeb0a7;
      --line: rgba(242, 241, 233, 0.2);
      --display: "Archivo Black", Impact, sans-serif;
      --body: "DM Sans", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--body);
    }
    a { color: inherit; }
    .topbar {
      display: flex;
      width: min(1180px, calc(100% - 48px));
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 0 auto;
      padding: 28px 0;
      border-bottom: 1px solid var(--line);
    }
    .nav-wrap {
      display: flex;
      align-items: center;
      gap: clamp(12px, 2vw, 28px);
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: clamp(12px, 2vw, 28px);
      flex-wrap: wrap;
    }
    .nav-links a {
      color: rgba(242, 241, 233, 0.75);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: .08em;
      transition: color .2s ease;
    }
    .nav-links a:hover, .nav-links a:focus-visible { color: var(--red); }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
    }
    .brand-mark {
      display: grid;
      width: 37px;
      aspect-ratio: 1;
      place-items: center;
      background: var(--red);
      color: var(--ink);
      font: 18px var(--display);
      transform: skew(-7deg);
    }
    .brand-name { font-size: 14px; font-weight: 700; line-height: 1.05; }
    .brand-name span { display: block; color: var(--red); font-size: 10px; font-weight: 600; }
    .socials { display: flex; gap: clamp(14px, 3vw, 34px); }
    .socials a {
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      transition: color .2s ease;
    }
    .socials a:hover, .socials a:focus-visible { color: var(--red); }
    .page-shell {
      width: min(1180px, calc(100% - 48px));
      margin: 0 auto;
      padding: 60px 0 80px;
    }
    .blog-hero {
      padding-bottom: 36px;
      border-bottom: 1px solid var(--line);
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 18px;
      color: var(--red);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .12em;
    }
    .eyebrow::before { width: 28px; height: 2px; background: currentColor; content: ""; }
    h1, h2, h3, p { margin-top: 0; }
    h1 {
      font: clamp(42px, 6vw, 80px)/.96 var(--display);
      text-transform: uppercase;
      max-width: 780px;
      margin-bottom: 18px;
    }
    .lead {
      max-width: 660px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
      margin: 0;
    }
    .blog-grid {
      margin-top: 42px;
    }
    #blog-post-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }
    .post-card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 100%;
      padding: 22px 22px 18px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      text-decoration: none;
      transition: border-color .2s ease, transform .2s ease;
      overflow-wrap: anywhere;
    }
    .post-image {
      display: block;
      width: calc(100% + 44px);
      max-width: none;
      aspect-ratio: 16 / 9;
      margin: -22px -22px 20px;
      object-fit: cover;
    }
    .post-card:hover, .post-card:focus-visible {
      border-color: rgba(240, 82, 75, 0.8);
      transform: translateY(-3px);
    }
    .category {
      color: var(--red);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .12em;
      margin-bottom: 14px;
    }
    .post-card h2 {
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.05;
      margin-bottom: 12px;
      text-transform: uppercase;
      font-family: var(--display);
    }
    .post-card p {
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 18px;
      overflow-wrap: anywhere;
    }
    .post-card h2 { overflow-wrap: anywhere; }
    .meta {
      margin-top: auto;
      color: rgba(242, 241, 233, 0.7);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      margin-top: 32px;
      padding: 0 20px;
      min-height: 52px;
      background: var(--red);
      color: var(--ink);
      font-weight: 700;
      text-decoration: none;
    }
    .cta[hidden] { display: none; }
    footer {
      display: flex;
      width: min(1180px, calc(100% - 48px));
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 0 auto;
      padding: 22px 0 30px;
      color: var(--muted);
      font-size: 11px;
    }
    footer p { margin: 0; }
    .footer-brand { color: var(--paper); font-weight: 700; }
    @media (max-width: 820px) {
      .nav-wrap { width: 100%; justify-content: space-between; }
      .nav-links { width: 100%; justify-content: space-between; }
      #blog-post-list { grid-template-columns: 1fr; }
      .topbar { width: calc(100% - 36px); }
      .page-shell, footer { width: calc(100% - 36px); }
    }
    @media (max-width: 560px) {
      .topbar { padding: 20px 0; }
      .nav-wrap { flex-direction: column; align-items: flex-start; }
      .nav-links { gap: 10px 16px; }
      .socials { gap: 12px; }
      .socials a { font-size: 11px; }
      .page-shell { padding-top: 40px; }
      footer { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="G Active Fitness home">
      <span class="brand-mark" aria-hidden="true">G</span>
      <span class="brand-name">G ACTIVE<span>FITNESS</span></span>
    </a>
    <div class="nav-wrap">
      <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="blog.html">Blog</a>
        <a href="admin.html">Admin</a>
        <a href="index.html#contact">Contact</a>
      </nav>
      <nav class="socials" aria-label="Social media">
        <a href="https://www.instagram.com/g_active_fitness?utm_source=ig_web_button_share_sheet&amp;stkn=ZDNlZDc0MzIxNw==" target="_blank" rel="noopener noreferrer">Instagram</a>
        <a href="https://www.facebook.com/profile.php?id=61584638510250" target="_blank" rel="noopener noreferrer">Facebook</a>
      </nav>
    </div>
  </header>

  <main class="page-shell">
    <section class="blog-hero">
      <p class="eyebrow">G Active blog</p>
      <h1>Strength, mindset, and momentum.</h1>
      <p class="lead">Practical coaching notes, fitness ideas, and habits that support long-term progress beyond the gym floor.</p>
    </section>

    <section id="latest-posts" class="blog-grid" aria-label="Recent blog posts">
      <div id="blog-post-list"></div>
    </section>
  </main>

  <footer>
    <p class="footer-brand">G Active Fitness</p>
    <p>Personal training for real life.</p>
    <p>&copy; 2026 G Active Fitness</p>
  </footer>

  <script>
    const storageKey = 'gactive_blog_posts';
    const imageDatabase = 'gactive_blog_media';
    const samplePostIds = ['routine-you-will-keep', 'three-strength-shifts', 'recovery-and-progress'];

    function openImageDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(imageDatabase, 1);
        request.onupgradeneeded = () => request.result.createObjectStore('images');
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function loadPostImage(imageId) {
      if (!imageId) return null;
      const database = await openImageDatabase();
      return new Promise((resolve, reject) => {
        const request = database.transaction('images').objectStore('images').get(imageId);
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error);
      });
    }

    const savedPosts = JSON.parse(localStorage.getItem(storageKey) || 'null');
    const posts = Array.isArray(savedPosts)
      ? savedPosts.filter((post) => !samplePostIds.includes(post.id))
      : [];
    const list = document.getElementById('blog-post-list');

    async function renderPosts() {
      list.replaceChildren();
      if (!posts.length) {
        const emptyMessage = document.createElement('p');
        emptyMessage.className = 'lead';
        emptyMessage.textContent = 'No articles yet. Check back soon.';
        list.append(emptyMessage);
        return;
      }
      posts.forEach((post) => {
      const readableDate = new Date(post.date).toLocaleDateString('en-GB', {
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });
      const card = document.createElement('a');
      card.className = 'post-card';
      card.href = `blog-post.html?id=${encodeURIComponent(post.id)}`;
      if (post.imageId) {
        loadPostImage(post.imageId).then((blob) => {
          if (!blob) return;
          const image = document.createElement('img');
          image.className = 'post-image';
          image.src = URL.createObjectURL(blob);
          image.alt = post.imageAlt || '';
          card.prepend(image);
        }).catch(() => {});
      }
      const category = document.createElement('span');
      category.className = 'category';
      category.textContent = post.category;
      const title = document.createElement('h2');
      title.textContent = post.title;
      const summary = document.createElement('p');
      summary.textContent = post.summary;
      const meta = document.createElement('span');
      meta.className = 'meta';
      meta.textContent = `${post.minutes} min read · ${readableDate}`;
      card.append(category, title, summary, meta);
      list.append(card);
      });
    }

    renderPosts();
  </script>
</body>
</html>
